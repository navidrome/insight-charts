<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="main" style="width: 2000px;height:600px;"></div>
<script type="text/javascript">
    // Initialize the echarts instance based on the prepared dom
    var myChart = echarts.init(document.getElementById('main'));
    // fetch('./charts/pie.json')
    //     .then(response => response.json())
    //     .then(option => {
    //         // Set the chart options using the data from bar.json
    //         myChart.setOption(option);
    //     })
    //     .catch(error => console.error('Error loading bar.json:', error));
    fetch('./charts/line.json')
        .then(response => response.json())
        .then(option => {
            // Set the chart options using the data from bar.json
            myChart.setOption(option);
        })
        .catch(error => console.error('Error loading line.json:', error));
</script>
</body>
</html>
